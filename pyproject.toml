[project]
name = "scanned-isbn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.2.1",
    "duckdb>=1.2.2",
    "log-to-db>=0.1.0",
    "pytz>=2025.2",
    "trogon>=0.6.0",
]

[project.scripts]
openlibrary_search = "scanned_isbn.search_openlibrary:main"
openlibrary_ingest = "scanned_isbn.save_data:main"

[dependency-groups]
dev = [
    "coverage>=7.10.6",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=6.2.1",
    "pytest-picked>=0.5.1",
    "pytest-randomly>=3.16.0",
    "ruff>=0.12.12",
    "twine>=6.2.0",
]

[tool.hatch.version]
path = "scanned_isbn/__init__.py"

[tool.ruff]
# Assume Python 3.13
target-version = "py313"
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
# Same as Black.
line-length = 88

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = [
  "B",
  "C",
  "E", # pycodestyle
  "F", # pyflakes
  "W",
  "I001", # isort
  ]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# src = ["data_prep_sql", "tests"]
ignore = ["E501", "E712", "F403", "F401", "C901", "E722", "C408", "B904", "W605"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--tb=no -v --cov=scanned_isbn"
markers = "smoke : smoke tests"
testpaths = ["tests"]
